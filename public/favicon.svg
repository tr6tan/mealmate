<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#EDE0C8"/>

  <!-- Basket with groceries -->
  <g fill="#2B3A67">
    <!-- Basket handle -->
    <path d="M 210,140 A 92,92 0 0 1 302,140 L 302,160 A 72,72 0 0 0 210,160 Z"/>

    <!-- Bottle (left side, sticking out of basket) -->
    <rect x="190" y="130" width="32" height="70" rx="6"/>
    <rect x="198" y="108" width="16" height="30" rx="4"/>
    <rect x="194" y="104" width="24" height="10" rx="3"/>

    <!-- Round item / apple (right side, sticking out) -->
    <circle cx="310" cy="170" r="30"/>
    <!-- Apple stem -->
    <rect x="307" y="138" width="6" height="14" rx="2"/>

    <!-- Basket body -->
    <path d="M 140,200 L 372,200 L 352,370 Q 348,390 328,390 L 184,390 Q 164,390 160,370 Z"/>

    <!-- Basket horizontal lines -->
    <rect x="148" y="240" width="216" height="4" rx="2" fill="#EDE0C8" opacity="0.3"/>
    <rect x="155" y="290" width="202" height="4" rx="2" fill="#EDE0C8" opacity="0.3"/>
    <rect x="160" y="340" width="190" height="4" rx="2" fill="#EDE0C8" opacity="0.3"/>
  </g>
</svg>
