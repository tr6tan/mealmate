<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fond bleu, coins arrondis -->
  <rect width="512" height="512" rx="112" fill="#0018A8"/>

  <!-- Carotte blanche, tournée -45° autour du centre -->
  <g transform="rotate(-45, 256, 256)">
    <!-- Corps de la carotte -->
    <path fill="white" d="
      M 82 256
      C 120 206 198 196 284 205
      L 344 198
      Q 388 198 388 256
      Q 388 314 344 314
      L 284 307
      C 198 316 120 306 82 256
      Z
    "/>

    <!-- Encoche 1 (bleue) -->
    <rect x="208" y="248" width="38" height="66" rx="8" fill="#0018A8"/>
    <!-- Encoche 2 (bleue) -->
    <rect x="257" y="248" width="38" height="66" rx="8" fill="#0018A8"/>

    <!-- Feuille haute -->
    <ellipse cx="424" cy="206" rx="52" ry="21" fill="white"
             transform="rotate(-32, 424, 206)"/>
    <!-- Feuille milieu -->
    <ellipse cx="443" cy="252" rx="55" ry="21" fill="white"/>
    <!-- Feuille basse -->
    <ellipse cx="424" cy="302" rx="52" ry="21" fill="white"
             transform="rotate(32, 424, 302)"/>
  </g>
</svg>
