<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Fond bleu -->
  <rect width="1200" height="630" fill="#0018A8"/>

  <!-- Cercles décoratifs très subtils -->
  <circle cx="80"  cy="540" r="320" fill="none" stroke="white" stroke-width="1" opacity="0.05"/>
  <circle cx="1120" cy="90" r="260" fill="none" stroke="white" stroke-width="1" opacity="0.05"/>

  <!-- Carotte centrée en haut (scale 0.5, tournée -45°) -->
  <g transform="translate(600, 175) scale(0.5) rotate(-45) translate(-256, -256)">
    <!-- Corps de la carotte -->
    <path fill="white" d="
      M 82 256
      C 120 206 198 196 284 205
      L 344 198
      Q 388 198 388 256
      Q 388 314 344 314
      L 284 307
      C 198 316 120 306 82 256
      Z
    "/>

    <!-- Encoche 1 (bleue) -->
    <rect x="208" y="248" width="38" height="66" rx="8" fill="#0018A8"/>
    <!-- Encoche 2 (bleue) -->
    <rect x="257" y="248" width="38" height="66" rx="8" fill="#0018A8"/>

    <!-- Feuille haute -->
    <ellipse cx="424" cy="206" rx="52" ry="21" fill="white"
             transform="rotate(-32, 424, 206)"/>
    <!-- Feuille milieu -->
    <ellipse cx="443" cy="252" rx="55" ry="21" fill="white"/>
    <!-- Feuille basse -->
    <ellipse cx="424" cy="302" rx="52" ry="21" fill="white"
             transform="rotate(32, 424, 302)"/>
  </g>

  <!-- Nom de l'app -->
  <text
    x="600" y="400"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="800"
    font-size="96"
    fill="white"
    text-anchor="middle"
    letter-spacing="-2">MealMate</text>

  <!-- Tagline -->
  <text
    x="600" y="460"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="400"
    font-size="26"
    fill="white"
    opacity="0.62"
    text-anchor="middle"
    letter-spacing="0.5">Planifiez vos repas de la semaine, en famille.</text>
</svg>
