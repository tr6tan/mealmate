<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Fond bleu -->
  <rect width="1200" height="630" fill="#0018A8"/>

  <!-- Cercles décoratifs très subtils -->
  <circle cx="80"  cy="540" r="320" fill="none" stroke="white" stroke-width="1" opacity="0.05"/>
  <circle cx="1120" cy="90" r="260" fill="none" stroke="white" stroke-width="1" opacity="0.05"/>

  <!-- Pain centré en haut : scale 0.55, centré à x=600, y≈190 -->
  <!-- translate(457, 75) scale(0.55) -->
  <!-- Résultat : bread x:498→702, y:115→291 -->
  <g transform="translate(457, 75) scale(0.55)">
    <!-- Ombre (bleu foncé sur fond bleu, subtile) -->
    <ellipse cx="308" cy="416" rx="145" ry="18" fill="#00107A" opacity="0.6"/>

    <!-- Corps du pain — contour blanc, fill beige -->
    <path
      fill="#F4F1EA"
      stroke="white"
      stroke-width="16"
      stroke-linejoin="round"
      stroke-linecap="round"
      d="M 75 393
         L 355 393
         L 445 323
         L 445 213
         L 355 198
         C 355 73 75 73 75 213
         Z"
    />

    <!-- Séparateur face/côté -->
    <line x1="355" y1="393" x2="355" y2="198"
      stroke="white" stroke-width="14" stroke-linecap="round" opacity="0.85"/>

    <!-- Anneau de croûte intérieur -->
    <path
      fill="none"
      stroke="white"
      stroke-width="13"
      stroke-linecap="round"
      opacity="0.85"
      d="M 90 220 Q 215 120 340 210"
    />
  </g>

  <!-- Nom de l'app -->
  <text
    x="600" y="400"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="800"
    font-size="96"
    fill="white"
    text-anchor="middle"
    letter-spacing="-2">MealMate</text>

  <!-- Tagline -->
  <text
    x="600" y="460"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="400"
    font-size="26"
    fill="white"
    opacity="0.62"
    text-anchor="middle"
    letter-spacing="0.5">Planifiez vos repas de la semaine, en famille.</text>
</svg>
